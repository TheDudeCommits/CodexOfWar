<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">P10 Round015 binary inward return hard mask</title>
  <desc id="desc">White pixels are the only editable trailing-arm corridor. Black pixels are frozen to the authoritative Round013 base.</desc>
  <rect width="1536" height="1024" fill="#000000"/>
  <!-- Clean the original trailing lower-arm path while keeping the shoulder attachment bounded. -->
  <path d="M 595 465 C 560 500 505 548 450 625" fill="none" stroke="#ffffff" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower upper-arm/elbow relocation corridor to the far-low-left Round014 vertex. -->
  <path d="M 578 488 C 515 590 430 730 370 845" fill="none" stroke="#ffffff" stroke-width="110" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Separate steep up-right forearm corridor to the original inward grip. -->
  <path d="M 370 845 C 390 790 420 700 450 625" fill="none" stroke="#ffffff" stroke-width="98" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="845" r="66" fill="#ffffff"/>
  <ellipse cx="450" cy="625" rx="66" ry="74" fill="#ffffff"/>
</svg>
