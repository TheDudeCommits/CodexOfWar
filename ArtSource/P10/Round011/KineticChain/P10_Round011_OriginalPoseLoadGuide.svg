<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#d35432"/>
    </marker>
    <style>
      .bone { fill:none; stroke:#263746; stroke-width:26; stroke-linecap:round; stroke-linejoin:round; }
      .spine { fill:none; stroke:#263746; stroke-width:32; stroke-linecap:round; stroke-linejoin:round; }
      .joint { fill:#f6f0df; stroke:#d35432; stroke-width:8; }
      .label { font-family:Arial,sans-serif; font-size:20px; font-weight:700; fill:#263746; }
      .small { font-family:Arial,sans-serif; font-size:17px; font-weight:700; fill:#596875; }
      .weapon { fill:none; stroke:#17222b; stroke-width:30; stroke-linecap:square; }
      .hilt { fill:none; stroke:#255e7a; stroke-width:34; stroke-linecap:round; }
      .ground { fill:none; stroke:#a8aaa8; stroke-width:5; }
      .load { fill:none; stroke:#d35432; stroke-width:15; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24 18; marker-end:url(#arrowhead); }
    </style>
  </defs>

  <rect width="1536" height="1024" fill="#eeeae1"/>
  <path class="ground" d="M 115 872 C 420 862, 760 880, 1415 864"/>

  <!-- Rear left leg: far rear, forefoot-only, heel visibly high and dragged inward. -->
  <path class="bone" d="M 730 558 L 530 688 L 402 782"/>
  <path class="bone" d="M 402 782 L 438 846 L 505 854"/>
  <path d="M 360 752 L 438 846 L 510 854" fill="none" stroke="#49758b" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 752 L 438 846" fill="none" stroke="#eeeae1" stroke-width="20" stroke-linecap="round"/>

  <!-- Massive right load leg: compressed hip/knee/ankle column over a broad planted foot. -->
  <path class="bone" d="M 802 552 L 914 650 L 1020 772"/>
  <path d="M 802 552 L 914 650 L 1020 772" fill="none" stroke="#324d5b" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>
  <path d="M 1020 772 L 1096 842 L 1240 850" fill="none" stroke="#324d5b" stroke-width="96" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M 1085 858 L 1255 858" fill="none" stroke="#17222b" stroke-width="18"/>

  <!-- Pelvis rotated hard against the ribcage. -->
  <path d="M 715 558 L 810 542" fill="none" stroke="#263746" stroke-width="50" stroke-linecap="round"/>
  <path d="M 682 500 L 790 422" fill="none" stroke="#49758b" stroke-width="68" stroke-linecap="round" opacity="0.62"/>
  <path class="spine" d="M 770 550 C 708 524, 654 479, 646 424 C 638 373, 672 337, 722 320"/>

  <!-- Separated scapulae: left retracts, right protracts/downshifts. -->
  <path d="M 606 370 L 666 404" fill="none" stroke="#d35432" stroke-width="18" stroke-linecap="round"/>
  <path d="M 744 342 L 820 374" fill="none" stroke="#d35432" stroke-width="18" stroke-linecap="round"/>

  <!-- Left arm extends and pulls from the rear scapula to trailing hand. -->
  <path class="bone" d="M 610 372 L 490 496 L 676 522"/>
  <!-- Right arm compresses from forward scapula to leading hand. -->
  <path class="bone" d="M 820 374 L 772 430 L 806 447"/>

  <!-- Neck/head counter-turn toward threat (viewer-left), away from blade travel. -->
  <path class="bone" d="M 722 320 L 716 278"/>
  <ellipse cx="700" cy="220" rx="64" ry="76" fill="#d9c6a6" stroke="#263746" stroke-width="18" transform="rotate(-18 700 220)"/>
  <path d="M 674 214 L 638 207" fill="none" stroke="#d35432" stroke-width="9" stroke-linecap="round"/>
  <path d="M 730 170 C 795 168, 816 215, 842 262" fill="none" stroke="#263746" stroke-width="22" stroke-linecap="round"/>

  <!-- One continuous same-hilt weapon axis. -->
  <path class="hilt" d="M 594 584 L 855 396"/>
  <path d="M 688 520 L 720 497" fill="none" stroke="#f6f0df" stroke-width="48" stroke-linecap="round"/>
  <path d="M 790 456 L 820 434" fill="none" stroke="#f6f0df" stroke-width="48" stroke-linecap="round"/>
  <path d="M 848 384 L 882 431" fill="none" stroke="#d9c6a6" stroke-width="36" stroke-linecap="square"/>
  <path class="weapon" d="M 866 402 L 1386 92"/>
  <path d="M 1290 150 L 1418 73 L 1383 129" fill="#17222b" stroke="#17222b" stroke-width="12"/>
  <circle cx="1118" cy="252" r="25" fill="#d35432" opacity="0.85"/>

  <!-- Explicit joint markers. -->
  <g>
    <circle class="joint" cx="730" cy="558" r="18"/><circle class="joint" cx="802" cy="552" r="18"/>
    <circle class="joint" cx="530" cy="688" r="18"/><circle class="joint" cx="402" cy="782" r="18"/>
    <circle class="joint" cx="438" cy="846" r="18"/><circle class="joint" cx="914" cy="650" r="18"/>
    <circle class="joint" cx="1020" cy="772" r="18"/><circle class="joint" cx="1096" cy="842" r="18"/>
    <circle class="joint" cx="610" cy="372" r="18"/><circle class="joint" cx="490" cy="496" r="18"/>
    <circle class="joint" cx="676" cy="522" r="18"/><circle class="joint" cx="820" cy="374" r="18"/>
    <circle class="joint" cx="772" cy="430" r="18"/><circle class="joint" cx="806" cy="447" r="18"/>
    <circle class="joint" cx="722" cy="320" r="18"/><circle class="joint" cx="770" cy="550" r="18"/>
  </g>

  <!-- The guide's sole continuous force arrow: blade mass through grip, torso, pelvis, right leg, and sole. -->
  <path class="load" d="M 1155 228 C 994 324, 850 420, 775 462 C 710 500, 735 548, 810 566 C 875 582, 925 646, 982 710 C 1025 758, 1080 814, 1176 838"/>

  <!-- Public-safe geometry labels. -->
  <text class="label" x="62" y="68">ORIGINAL GROUND-ARC ARREST POSE / LOAD GUIDE</text>
  <text class="small" x="62" y="98">Authored vector geometry • explicit joints • one weapon axis • no third-party pose image</text>
  <text class="small" x="1055" y="300">BLADE CoM OUTSIDE TORSO</text>
  <text class="small" x="1110" y="890">RIGHT SOLE: PLANTED / COMPRESSED</text>
  <text class="small" x="245" y="900">LEFT HEEL HIGH • TOE DRAG INWARD</text>
  <text class="small" x="570" y="626">PELVIS ↔ RIBCAGE COUNTER-ROTATION</text>
  <text class="small" x="430" y="344">RETRACT / EXTEND</text>
  <text class="small" x="825" y="340">PROTRACT / COMPRESS</text>
  <text class="small" x="548" y="470">EXTENDED ELBOW</text>
  <text class="small" x="830" y="476">COMPRESSED ELBOW</text>
  <text class="small" x="595" y="615">POMMEL</text>
  <text class="small" x="858" y="370">GUARD</text>
</svg>
